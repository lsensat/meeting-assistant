[package]
name = "meeting-assistant"
version = "0.2.19"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Meeting Assistant: dual-source recording, transcription and summary."
default-run = "meeting-assistant"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
meeting-core = { path = "../crates/meeting-core" }

# The shell. WKWebView on macOS, WebView2 on Windows. Both are modern engines,
# so the frontend is plain ES modules with no bundler and no build step.
# `tray-icon` alone is not enough to load an icon from a file: constructing a
# `tauri::image::Image` from the bundled PNG needs `image-png` as well.
# `devtools` is normally debug-only. It is enabled here because the Windows
# build is only ever exercised as a RELEASE artifact from CI — there is no
# Windows dev machine — and without it a webview that fails to load is a white
# rectangle with no way to ask it why. Right-click -> Inspect, or set MA_DEBUG=1
# to have the windows open their own inspector. Remove once Windows is verified.
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
# Native folder picker and "reveal in Finder/Explorer", replacing the Python's
# `filedialog` and `os.startfile` (`app.py:689`).
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# One running app, enforced by the app because the OS does not do it. macOS
# reuses a running bundle when launched from Finder or the Dock but not via
# `open -n` or the binary directly; Windows does nothing at all. With a
# processing queue that is not untidiness but corruption: two instances would
# scan the same output folder, race on the same meeting.json and compete for the
# same audio devices.
tauri-plugin-single-instance = "2"

# Pinned exactly. cpal 0.18 was a large API break (streams no longer auto-start,
# StreamConfig by value, unified Error type, `description()` replacing `name()`)
# and almost every example online targets <= 0.16. See risk R4 in the Windows
# plan; the corrected API usage is demonstrated in spikes/loopback-probe.
cpal = "=0.18.2"

# Digest verification for downloaded Whisper weights. RustCrypto: pure Rust,
# no C, no build-time toolchain.
sha2 = "0.10"
sha1 = "0.10"

hound = "3.5.1"

# `recv_timeout` on the writer side and `try_send` on the realtime side. std's
# mpsc has no bounded `try_send` with this shape.
crossbeam-channel = "0.5"

# Ollama speaks plain HTTP on loopback and only two endpoints are used, so a
# wrapper crate would only add a layer that can lag behind the server. Blocking
# because the pipeline owns a worker thread already — this keeps tokio out.
# TLS is required, despite Ollama itself being plain HTTP on 127.0.0.1: the
# Whisper weights are fetched from huggingface.co over HTTPS, which is the only
# outbound request this app ever makes.
#
# rustls rather than native-tls: one less system library to link against, and
# it behaves identically on both target platforms.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
# API keys go in the OS keychain (macOS Keychain, Windows Credential Manager),
# never in config.json next to the recordings.
keyring = { version = "3", features = ["apple-native", "windows-native"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# whisper.cpp. GGUF weights, not CTranslate2 — the Python's faster-whisper
# models are a different format and are not reusable.
#
# No feature flags, and that means **no GPU at all — on either platform**.
#
# This comment used to claim Metal was wired in automatically for
# `aarch64-apple-darwin`. It is not, and the mistake was load-bearing: it made
# the Mac's speed look like GPU acceleration and Windows' slowness look like the
# absence of it, when both are CPU numbers. `whisper-rs-sys/build.rs` defines
# `GGML_METAL=OFF` unless the `metal` feature is on, and whisper-rs 0.16.0 has no
# target-specific default that turns it on.
#
# The Mac is fast because of Accelerate (linked unconditionally by
# whisper-rs-sys) plus NEON on Apple Silicon. Enabling `metal` here, and
# `vulkan` on Windows, is a deliberate change with real consequences — a build
# dependency on the Vulkan SDK, and a load-time DLL import that breaks launch on
# a machine without the loader — so it is a decision, not a default.
# CoreML is a further opt-in that also requires converting the model.
whisper-rs = "0.16"

# CommonMark, for rendering a meeting summary in the library window. No default
# features: the HTML writer is not used — the parser is driven directly so the
# app builds the DOM itself and never touches `innerHTML`.
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["simd"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# The Tauri app. `rec` and `process` are the Phase M2/M3 CLI drivers; they stay
# because they exercise the audio and pipeline layers without the UI in the way.
# The title bar is drawn by Windows, not by the webview, so matching it to the
# app's background needs a DWM call. Pinned to the same major the Tauri tree
# already resolves, so no second copy of `windows` is built.
# Core Audio, for muting the microphone system-wide. Already in the tree via
# cpal; named here because a transitive dependency is not an import.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = ["CFString"] }

[target.'cfg(windows)'.dependencies]
# The audio features are for `audio::system_mute`, which mutes the capture
# endpoint through `IAudioEndpointVolume`. The three beyond the obvious two are
# not optional and not guessable: `IPropertyStore::GetValue` — how a device's
# friendly name is read — is gated on `Win32_System_Com_StructuredStorage` and
# `Win32_System_Variant` because it returns a `PROPVARIANT`, and `IMMDevice`'s
# property store lives under `Win32_UI_Shell_PropertiesSystem`. Without them the
# module does not compile at all.
#
# Established by compiling that module for `x86_64-pc-windows-msvc` from a Mac
# in an isolated crate — `cargo check` needs no linker and the `windows` crate is
# pure Rust, so the whole feature set is verifiable without a Windows machine.
# Worth knowing: the first Windows build would otherwise have failed on an
# unresolved import.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[[bin]]
name = "meeting-assistant"
path = "src/main.rs"

[[bin]]
name = "rec"
path = "src/bin/rec.rs"
