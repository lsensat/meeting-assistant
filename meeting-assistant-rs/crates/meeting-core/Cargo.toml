[package]
name = "meeting-core"
version = "0.2.9"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Hardware-independent logic for Meeting Assistant: device-selection policy, audio conversion, progress math."

# Pure, portable dependencies only — nothing platform-specific, so the whole
# crate builds and tests on any OS. Audio backends, Whisper and Tauri live in
# src-tauri instead.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
