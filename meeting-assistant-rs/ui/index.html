<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meeting Assistant</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!--
    Every user-visible string carries `data-i18n`. `applyLanguage()` walks
    `[data-i18n]` and re-sets textContent, which replaces the 154 lines of
    `refresh_ui_language()` (`app.py:4110`) that hand-set ~40 widget texts one
    by one. This is the single biggest reason the port needs no UI framework.
  -->
  <main>
    <section class="session-card">
      <!--
        The dot is a sibling of the status line, not a child: `setStatus` writes
        `textContent`, which would wipe out any element nested inside it.
      -->
      <div class="status-row">
        <!--
          Readiness lamps, absolutely positioned so the status message stays
          centred on the row regardless of them, and so a long message cannot
          shift them. `role="img"` with an `aria-label` because the state is
          otherwise carried by colour alone, which is not available to everyone;
          the label and the tooltip say the same thing.
        -->
        <div class="status-lamps">
          <span class="lamp" id="lamp-whisper" role="img"
                data-state="pending" data-tooltip="lamp_whisper_pending"></span>
          <span class="lamp" id="lamp-summary" role="img"
                data-state="pending" data-tooltip="lamp_ollama_pending"></span>
        </div>
        <span class="rec-dot" aria-hidden="true"></span>
        <div class="status-line" id="status" data-i18n="checking_environment">Checking environment...</div>
        <!--
          Sits inline with the message, as the one action that sentence implies.
          The icon, tooltip and behaviour are all set in JS because they depend
          on whether Ollama is installed: offering to start something absent is
          a dead end, so that case offers the download instead.

          The `d` is swapped rather than toggling two `<svg>` elements —
          `hidden` is an IDL attribute of HTMLElement and does nothing on an
          SVGElement, which has caught this codebase once already.

          `data-tooltip` must be present at init: `initTooltips` binds only
          elements that already carry it, though it reads the value lazily on
          hover, so JS can change which key it points at.
        -->
        <button class="status-action" id="status-action" hidden data-tooltip="setup_open_ollama">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d=""/></svg>
        </button>
      </div>

      <!--
        Timer and transport share one row: timer left, buttons right. Stacking
        them vertically pushes the result row past the fixed 275px window
        height, and it is not what the original does.
      -->
      <div class="session-row">
        <div class="timer" id="timer">00:00:00</div>
        <div class="transport">
          <button id="start-button" data-tooltip="tooltip_start" aria-label="Start">
            <!-- Heroicons "play", solid: rounded nose and a true optical centre. -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 0 1 0 1.971l-11.54 6.348a1.125 1.125 0 0 1-1.667-.985V5.653Z"/></svg>
          </button>
          <button id="stop-button" data-tooltip="tooltip_stop" aria-label="Stop" disabled>
            <!-- Heroicons "stop", solid: rounded corners rather than a bare rect. -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7.5a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-9a3 3 0 0 1-3-3v-9Z"/></svg>
          </button>
          <!--
            Discard the meeting: stops recording and deletes the folder without
            transcribing. Half the diameter of Stop so it cannot be mistaken for
            the primary action, and disabled until a meeting is actually running.
          -->
          <button id="cancel-button" data-tooltip="tooltip_cancel" aria-label="Cancel" disabled>
            <svg class="icon-outline" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M18 18 6 6"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!--
      The three stage chips lived here: Audio / Transcript / Summary. Removed
      with the processing queue, which says the same thing per meeting and says
      it better — "Transcribing 2/3", on the card that owns it. The chips
      described *the* meeting, and once more than one can be in flight there is
      no such thing: they would flicker between jobs, showing a state that
      belongs to neither.
    -->

    <!--
      Collapsed by default. A <button>, not a clickable <div>, so it is
      focusable and keyboard-operable for free and `aria-expanded` carries the
      state to assistive tech.
    -->
    <div class="audio-panel">
      <button class="devices-toggle" id="devices-toggle" aria-expanded="false"
              aria-controls="devices-detail">
        <span data-i18n="devices_summary">Microphone and Audio</span>
        <!--
          Lit when a device the user did not choose is in use. The panel used to
          force itself open to say this, which meant it reopened every time it
          was closed, for as long as the fallback lasted. A marker visible while
          collapsed says the same thing without taking the decision away.
        -->
        <span class="fallback-dot" id="devices-fallback" hidden
              data-tooltip="devices_fallback"></span>
        <span class="rule" aria-hidden="true"></span>
        <!-- Rotated 180° when open rather than swapped for a second glyph:
             one element, one transition, and no `hidden` juggling on an SVG. -->
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
        </svg>
      </button>
      <div class="devices-detail" id="devices-detail" hidden>
        <div id="device-mic">—</div>
        <div id="device-system">—</div>
      </div>
    </div>

    <!--
      The processing queue. Hidden entirely when empty, which is the normal
      state — it appears when a meeting finishes and goes away when the work is
      done, so the window is only as tall as there is something to say.

      A panel in this window rather than separate bubble windows: each Tauri
      window is a full webview, and one per meeting would make an app that is
      meant to feel light considerably heavier. The chrome is already dark with
      rounded panels floating on it, so these read as separate cards anyway, and
      moving and minimising are inherently correct with a single window.
    -->
    <div class="audio-panel queue-panel" id="queue" hidden>
      <div class="queue-head">
        <button class="devices-toggle" id="queue-toggle" aria-expanded="true"
                aria-controls="queue-list">
          <span data-i18n="queue_title">Processing</span>
          <span class="queue-count" id="queue-count"></span>
          <span class="rule" aria-hidden="true"></span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
          </svg>
        </button>
        <!--
          One switch, for everything. Per-meeting pausing would be a different
          verb wearing the same icon: this is a decision about when the machine
          does work, not about which meetings matter.
        -->
        <button class="status-action" id="queue-pause" data-tooltip="queue_pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d=""/></svg>
        </button>
      </div>
      <div class="devices-detail queue-list" id="queue-list"></div>
    </div>

    <!--
      Absorbs any surplus window height, so a window taller than the content
      shows the toolbar sitting at the bottom edge rather than a dead gap below
      it. This is pure CSS and therefore the only part of the fit that still
      works when the frontend JS fails to run, which is how Windows first
      presented. Its measured height is also exactly the surplus, which is what
      lets `contentHeight()` recover the natural height despite the stretch.
    -->
    <div class="spacer" aria-hidden="true"></div>

    <div class="result-row">
      <!--
        Mute is available at rest, not only mid-meeting: muting before you start
        is a reasonable thing to want, and the flag is applied to the first
        sample. Both glyphs ship in the markup and one is hidden, so toggling
        never has to build SVG at runtime.
      -->
      <button class="btn btn--mic" id="mute-button" data-tooltip="tooltip_mute" aria-label="Mute">
        <!--
          Solid mic, traced from the supplied PNG: filled capsule body, with the
          pickup arc, stem and base drawn as round-capped strokes. Mixed fill and
          stroke, so the paths carry their own classes rather than inheriting the
          outline defaults the other icons use.
        -->
        <svg id="mic-on" class="icon-mixed" viewBox="0 0 24 24" aria-hidden="true">
          <path class="solid" d="M12 1.5a3.75 3.75 0 0 0-3.75 3.75v6a3.75 3.75 0 0 0 7.5 0v-6A3.75 3.75 0 0 0 12 1.5Z"/>
          <path class="line" d="M5.25 11.25a6.75 6.75 0 0 0 13.5 0"/>
          <path class="line" d="M12 18v3.75"/>
          <path class="line" d="M7.5 21.75h9"/>
        </svg>
        <!--
          The muted variant is the same glyph with the diagonal bar from the
          second PNG. The PNG cuts a gap through the mic where the bar crosses;
          that is reproduced with an under-stroke painted in the button's own
          background colour, which is why the muted state deliberately keeps
          that background rather than greying out.
        -->
        <svg id="mic-off" class="icon-mixed" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path class="solid" d="M12 1.5a3.75 3.75 0 0 0-3.75 3.75v6a3.75 3.75 0 0 0 7.5 0v-6A3.75 3.75 0 0 0 12 1.5Z"/>
          <path class="line" d="M5.25 11.25a6.75 6.75 0 0 0 13.5 0"/>
          <path class="line" d="M12 18v3.75"/>
          <path class="line" d="M7.5 21.75h9"/>
          <path class="cut" d="M19.5 3 3.75 18.75"/>
          <path class="line" d="M19.5 3 3.75 18.75"/>
        </svg>
      </button>

      <div class="center">
        <button class="btn btn--result btn--unavailable" id="transcript-button" data-tooltip="tooltip_transcript" aria-label="Transcript">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg>
        </button>
        <button class="btn btn--result btn--unavailable" id="summary-button" data-tooltip="tooltip_summary">
          <span data-i18n="stage_summary">Summary</span>
        </button>
        <button class="btn btn--result" id="folder-button" data-tooltip="tooltip_folder" aria-label="Folder">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z"/></svg>
        </button>
      </div>

      <button class="btn btn--dark" id="settings-button" data-tooltip="tooltip_settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 0 0 15 0m-15 0a7.5 7.5 0 1 1 15 0m-15 0H3m16.5 0H21m-1.5 0H12m-8.457 3.077 1.41-.513m14.095-5.13 1.41-.513M5.106 17.785l1.15-.964m11.49-9.642 1.149-.964M7.501 19.795l.75-1.3m7.5-12.99.75-1.3m-6.063 16.658.26-1.477m2.605-14.772.26-1.477m0 17.726-.26-1.477M10.698 4.614l-.26-1.477M16.5 19.794l-.75-1.299M7.5 4.205 12 12m6.894 5.785-1.149-.964M6.256 7.178l-1.15-.964m15.352 8.864-1.41-.513M4.954 9.435l-1.41-.514M12.002 12l-3.75 6.495"/></svg>
      </button>
    </div>
  </main>

  <!--
    Meeting-title prompt, replacing the Python's `simpledialog`.

    Deliberately not `window.prompt()`: WKWebView only shows a JS text-input
    panel if the host app implements the corresponding delegate, and Tauri does
    not. `prompt()` therefore returns null with no dialog and no error on macOS,
    which would mean every meeting title was silently discarded.
  -->
  <div class="modal-backdrop" id="title-modal" hidden>
    <div class="modal">
      <label for="meeting-title" data-i18n="meeting_name_optional">Meeting name (optional)</label>
      <input type="text" id="meeting-title" autocomplete="off" />
      <!--
        One button, not two. The name is optional, so leaving the field blank
        and pressing this IS the skip path — a separate "Skip" button did
        literally the same thing whenever the field was empty.
      -->
      <div class="modal-actions">
        <button class="btn btn--primary" id="title-confirm" data-i18n="save_meeting">Save meeting</button>
      </div>
    </div>
  </div>

  <!--
    Confirmation for destructive actions. Same reason as the title prompt above:
    `window.confirm()` needs a WKWebView host delegate that Tauri does not
    implement, so it would return false with no dialog — silently turning
    "cancel the meeting" into a no-op.
  -->
  <div class="modal-backdrop" id="confirm-modal" hidden>
    <div class="modal">
      <p id="confirm-message"></p>
      <div class="modal-actions">
        <button class="btn btn--quiet" id="confirm-no" data-i18n="confirm_no">Keep recording</button>
        <button class="btn btn--primary" id="confirm-yes" data-i18n="confirm_yes">Discard</button>
      </div>
    </div>
  </div>

  <!--
    Discard destroys the one artifact that cannot be recreated, so it asks
    first. Its own modal rather than the cancel one above: those buttons say
    "Keep recording", which is wrong for a meeting that has already stopped.
  -->
  <div class="modal-backdrop" id="discard-modal" hidden>
    <div class="modal">
      <h2 data-i18n="queue_discard_title"></h2>
      <p data-i18n="queue_discard_body"></p>
      <div class="modal-actions">
        <button class="btn btn--quiet" id="discard-no" data-i18n="queue_discard_cancel"></button>
        <button class="btn btn--primary" id="discard-yes" data-i18n="queue_discard_confirm"></button>
      </div>
    </div>
  </div>

  <!--
    Shown when a recording finished with audio missing.

    A modal rather than a status line: the status line is overwritten by the
    processing messages within seconds of a meeting ending, and the title dialog
    covers it before that. This is the only notice the user gets that a meeting
    is incomplete, and re-running the pipeline cannot recover what was never
    captured — so it waits to be read.
  -->
  <div class="modal-backdrop" id="damage-modal" hidden>
    <div class="modal">
      <h2 id="damage-title"></h2>
      <p id="damage-body"></p>
      <div class="modal-actions">
        <button class="btn btn--primary" id="damage-ok" data-i18n="damage_dismiss"></button>
      </div>
    </div>
  </div>

  <div id="tooltip"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
