<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meeting Assistant — Summaries</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!--
    Two panes: the meetings on the left, the selected summary on the right.

    The list column is a fixed width and the window is resizable, so the
    document reflows and the list does not. A draggable divider can come later
    if 260px proves wrong; it would need its position persisted, and that is a
    piece of state to earn rather than assume.
  -->
  <div class="library">
    <aside class="library-list" id="library-list" aria-label="Meetings"></aside>

    <main class="library-doc">
      <!--
        The document's own actions sit above it rather than in the list: they
        act on what is being read, not on what is selected.
      -->
      <header class="library-head" id="library-head" hidden>
        <div class="library-head-text">
          <h1 id="doc-title"></h1>
          <p class="library-head-meta" id="doc-meta"></p>
        </div>
        <button class="btn btn--secondary" id="open-folder" data-tooltip="library_open_folder"
                aria-label="Open folder">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z"/></svg>
        </button>
      </header>

      <!--
        Built entirely by `markdown.js` from Rust's token stream. Nothing writes
        markup into this element as a string.
      -->
      <article class="library-body" id="doc-body"></article>

      <p class="library-empty" id="library-empty" data-i18n="library_empty">
        Summaries appear here once a meeting has been processed.
      </p>
    </main>
  </div>

  <div id="tooltip"></div>
  <script type="module" src="js/library.js"></script>
</body>
</html>
