<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meeting Assistant — Library</title>
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/theme-boot.js"></script>
</head>
<body>
  <!--
    Two panes: the meetings on the left, the selected summary on the right.

    The list column is a fixed width and the window is resizable, so the
    document reflows and the list does not. A draggable divider can come later
    if 260px proves wrong; it would need its position persisted, and that is a
    piece of state to earn rather than assume.
  -->
  <div class="library">
    <aside class="library-list">
      <!--
        Any Markdown file, not only summaries. The dialog runs in Rust, which
        hands back an id — see `pick_markdown_file` for why the path never
        reaches this page.
      -->
      <button class="btn btn--secondary library-open" id="open-file" data-i18n="library_open_file">
        Open a Markdown file…
      </button>
      <div id="library-list" aria-label="Meetings"></div>
    </aside>

    <main class="library-doc">
      <!--
        The document's own actions sit above it rather than in the list: they
        act on what is being read, not on what is selected.
      -->
      <header class="library-head" id="library-head" hidden>
        <div class="library-head-text">
          <h1 id="doc-title"></h1>
          <p class="library-head-meta" id="doc-meta"></p>
        </div>
        <!--
          Read and Edit are one button that swaps: the icon shows what pressing
          it will do, so it is a pencil while reading and an eye while editing.
        -->
        <button class="btn btn--secondary" id="toggle-edit" data-tooltip="library_edit"
                data-i18n-label="library_edit" aria-label="Edit" aria-pressed="false">
          <svg class="when-reading" viewBox="0 0 24 24" aria-hidden="true"><path d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"/></svg>
          <svg class="when-editing" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
        </button>
        <!--
          The transcript used to be a button in the main window, where it only
          ever reached the meeting that had just finished. Per meeting, here,
          it works for all of them.
        -->
        <button class="btn btn--secondary" id="open-transcript" data-tooltip="library_open_transcript"
                aria-label="Open transcript">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg>
        </button>
        <button class="btn btn--secondary" id="open-folder" data-tooltip="library_open_folder"
                aria-label="Open folder">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z"/></svg>
        </button>
      </header>

      <!--
        Files opened from outside the app are read-only: there is no Edit
        button for them, and this line says why rather than leaving it to be
        guessed.
      -->
      <p class="library-readonly" id="doc-readonly" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
        <span data-i18n="library_read_only">Read only. Only meeting summaries can be edited here.</span>
      </p>

      <!--
        Built entirely by `markdown.js` from Rust's token stream. Nothing writes
        markup into this element as a string.
      -->
      <article class="library-body" id="doc-body"></article>

      <!--
        The editor. Markdown source in a textarea, with a toolbar that inserts
        the syntax — what is saved is exactly what is typed, and the document is
        still rendered by `markdown.js` when switching back to Read.

        Toolbar buttons are `tabindex="-1"` and cancel their mousedown, so
        pressing one never takes focus or the selection away from the text.
      -->
      <section class="library-editor" id="doc-editor" hidden>
        <div class="editor-toolbar" role="toolbar" data-i18n-label="editor_toolbar" aria-label="Formatting">
          <button class="editor-tool" data-action="bold" data-tooltip="editor_bold" data-i18n-label="editor_bold" tabindex="-1"><b>B</b></button>
          <button class="editor-tool" data-action="italic" data-tooltip="editor_italic" data-i18n-label="editor_italic" tabindex="-1"><i>I</i></button>
          <button class="editor-tool" data-action="strike" data-tooltip="editor_strike" data-i18n-label="editor_strike" tabindex="-1"><s>S</s></button>
          <button class="editor-tool" data-action="heading" data-tooltip="editor_heading" data-i18n-label="editor_heading" tabindex="-1"><b>H</b></button>
          <span class="editor-sep" aria-hidden="true"></span>
          <button class="editor-tool" data-action="bullets" data-tooltip="editor_bullets" data-i18n-label="editor_bullets" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
          </button>
          <button class="editor-tool" data-action="numbers" data-tooltip="editor_numbers" data-i18n-label="editor_numbers" tabindex="-1">1.</button>
          <button class="editor-tool" data-action="quote" data-tooltip="editor_quote" data-i18n-label="editor_quote" tabindex="-1">&ldquo;</button>
          <button class="editor-tool" data-action="code" data-tooltip="editor_code" data-i18n-label="editor_code" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5"/></svg>
          </button>
          <button class="editor-tool" data-action="link" data-tooltip="editor_link" data-i18n-label="editor_link" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"/></svg>
          </button>
          <span class="editor-sep" aria-hidden="true"></span>
          <button class="editor-tool" data-action="undo" id="editor-undo" data-tooltip="editor_undo" data-i18n-label="editor_undo" tabindex="-1" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"/></svg>
          </button>
          <button class="editor-tool" data-action="redo" id="editor-redo" data-tooltip="editor_redo" data-i18n-label="editor_redo" tabindex="-1" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 15 6-6m0 0-6-6m6 6H9a6 6 0 0 0 0 12h3"/></svg>
          </button>
          <span class="editor-status" id="editor-status" role="status" aria-live="polite"></span>
        </div>

        <!--
          Shown when the file changed on disk after it was loaded. Autosave
          stops until one of these is pressed: a timer must not decide whose
          version of a summary survives.
        -->
        <div class="editor-conflict" id="editor-conflict" role="alert" hidden>
          <span data-i18n="editor_conflict">This summary was changed outside the editor.</span>
          <button class="btn btn--quiet" id="editor-reload" data-i18n="editor_reload">Reload from disk</button>
          <button class="btn btn--secondary" id="editor-keep" data-i18n="editor_keep_mine">Keep my version</button>
        </div>

        <textarea class="editor-text" id="editor-text" spellcheck="true"
                  data-i18n-label="editor_text" aria-label="Summary source"></textarea>
      </section>

      <p class="library-empty" id="library-empty" data-i18n="library_empty">
        Summaries appear here once a meeting has been processed.
      </p>
    </main>
  </div>

  <div id="tooltip"></div>
  <script type="module" src="js/library.js"></script>
</body>
</html>
